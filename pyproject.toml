[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neon-drop"
version = "0.1.0"
description = "A modern falling-block puzzler with synthwave visuals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Olasupo" }]
dependencies = [
    "pygame-ce>=2.4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0", "pygbag>=0.9.0"]

[project.scripts]
neon-drop = "neon_drop.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neon_drop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]